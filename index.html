<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トリック・オア・タイムアタック</title>
<!-- 怖さを出すフォント（Google Fonts）。ネットが無いときは普通のフォントになる -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Hachi+Maru+Pop&family=DotGothic16&family=Creepster&family=Nosifer&family=UnifrakturMaguntia&family=Rock+Salt&family=Permanent+Marker&family=Special+Elite&family=Eater&family=Butcherman&family=Rubik+Wet+Paint&family=Pirata+One&family=Rubik+Glitch&family=Jolly+Lodger&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #07040f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }
  #typing {
    position: absolute; left: 50%; top: 70%; transform: translateX(-50%);
    width: 40%; font-size: 2.4vmin; padding: 0.6em 1em; border-radius: 8px;
    border: 3px solid #ff8a1c; background: #1a1026; color: #fff; outline: none;
  }
  #jumpscare { position: absolute; inset: 0; background: #000; }
  #jumpscare img, #jumpscare video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #jumpscare [hidden] { display: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ff8a1c; font-size: 3vmin; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <input id="typing" hidden autocomplete="off" placeholder="トリックオアトリート！！！！！">
  <div id="jumpscare" hidden><img alt=""><video id="jumpscareVideo" playsinline preload="auto"></video></div>
  <div id="loading">🎃 読み込み中…</div>
</div>

<script src="js/voice.js?v=1025c"></script>
<script src="js/rta.js?v=1025c"></script>
<script src="js/scenery.js?v=1025c"></script>
<script src="js/horror.js?v=1025c"></script>
<script src="js/secret.js?v=1025c"></script>
<script src="js/game.js?v=1025c"></script>
</body>
</html>
